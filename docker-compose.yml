
services:
  # ── FastAPI Backend ─────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # .env'i override eder — Docker servis iletişimi için gerekli
      - POSTGRES_URL=postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-legalai}
      - OPENSEARCH_HOST=opensearch
      - OPENSEARCH_PORT=9200
      - CORS_ORIGINS=["http://localhost:3000","http://frontend-next:3000"]
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      postgres:
        condition: service_healthy
      opensearch:
        condition: service_healthy
    volumes:
      - ./data:/app/data
      - ./backend:/app
      - hf_model_cache:/root/.cache/huggingface   # named volume — model indirme cached
    restart: unless-stopped

  # ── PostgreSQL ──────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    env_file:
      - .env
    environment:
      # .env'deki POSTGRES_USER / POSTGRES_PASSWORD / POSTGRES_DB kullanılır
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-legalai}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./sql/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── OpenSearch ──────────────────────────────────────────────
  opensearch:
    image: opensearchproject/opensearch:2.12.0
    environment:
      - discovery.type=single-node
      # Şifre zorunlu olarak .env'den alınır, fallback yok — deploy öncesi set edin
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=${OPENSEARCH_ADMIN_PASSWORD}
      - plugins.security.disabled=true
    ports:
      - "9200:9200"
      - "9600:9600"
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health | grep -q '\"status\":\"green\\|yellow\"'"]
      interval: 15s
      timeout: 10s
      retries: 10
    restart: unless-stopped

  # ── OpenSearch Dashboards (opsiyonel) ───────────────────────
  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:2.12.0
    ports:
      - "5601:5601"
    environment:
      - OPENSEARCH_HOSTS=["http://opensearch:9200"]
      - plugins.security.disabled=true
    depends_on:
      - opensearch
    restart: unless-stopped
    profiles:
      - monitoring

  frontend-next:
    build:
      context: ./frontend-next
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    volumes:
      - ./frontend-next:/app
      - frontend_node_modules:/app/node_modules   # named volume — cache korunur
      - frontend_next_cache:/app/.next             # named volume — build cache korunur
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
  opensearch_data:
  hf_model_cache:         # HuggingFace embedding model cache
  frontend_node_modules:  # Next.js node_modules cache
  frontend_next_cache:    # Next.js build output cache
